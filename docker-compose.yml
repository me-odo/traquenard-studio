services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: traquenard
      POSTGRES_USER: traquenard
      POSTGRES_PASSWORD: traquenard
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U traquenard']
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - traquenard-pg:/var/lib/postgresql/data
volumes:
  traquenard-pg:
